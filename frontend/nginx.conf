server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location /api/ {
    set $backend_upstream http://backend:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
  }
  location / { try_files $uri $uri/ /index.html; }
}
